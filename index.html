  tech:    { name:'技术神甫',  ranks:['学徒','技术神甫','机神学家','铸造统领','技术军长'],  god:'万机神' }
};

/* ============================
   状态
============================ */
const DEFAULT_STATE = () => ({
  name:'', cheatMode:false,
  age:14, eventCount:0,
  body:25, will:25, mind:25,
  renown:5, corruption:0, loyalty:30,
  phase:'hive', path:null, rank:0, progress:0,
  stcFound:false,
  rejected:[], log:[],
   currentEvent:null, ended:false, started:false,
  chaosJoinEventCount: 0,
  godsSeen: [],
 injury: 0,
  injuryNotified30: false,
  injuryNotified60: false,
  injuryNotified90: false,
  restCharges: 1
});

let S = DEFAULT_STATE();

const EVENTS_PER_YEAR = 4;
const RECENT_SIZE = 10;
let recentEvents = [];

const clamp = (v, a=0, b=100) => Math.max(a, Math.min(b, v));
const rand  = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick  = arr => arr[rand(0, arr.length - 1)];

function pickFreshEvent(pool) {
  const fresh = pool.filter(e => !recentEvents.includes(e.id));
  const candidates = fresh.length > 0 ? fresh : pool;
  const chosen = pick(candidates);
  recentEvents.push(chosen.id);
  if (recentEvents.length > RECENT_SIZE) recentEvents.shift();
  return chosen;
}

/* ============================
   存档
============================ */
const SAVE_KEY = 'hiveFate_v4_save';
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...S, currentEvent:null })); } catch(e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return { ...DEFAULT_STATE(), ...JSON.parse(raw) };
  } catch(e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch(e) {} }

/* ============================
   工具
============================ */
function addLog(text, cls='') {
  S.log.push({ text, cls });
  if (S.log.length > 80) S.log.shift();
}
function applyEffect(e={}) {
  ['body','will','mind','renown','corruption','loyalty'].forEach(k => {
    if (e[k]) S[k] = clamp(S[k] + e[k]);
  });
  if (e.injury) applyInjury(e.injury);
  if (e.progress && S.phase === 'path') {
    S.progress += e.progress;
    checkPromotion();
  }
  saveGame();
}
const EFFECT_LABELS = { body:'肉体', will:'意志', mind:'智慧', renown:'声望', corruption:'腐化', loyalty:'忠诚', progress:'进度' };
function formatEffect(e) {
  if (!e) return '';
  return Object.entries(e).filter(([k,v]) => v && EFFECT_LABELS[k])
    .map(([k,v]) => `${EFFECT_LABELS[k]}${v>0?'+':''}${v}`).join(' ');
}

/* ============================
   战斗
============================ */
function battlePower() {
  const base = S.body * 1.0 + S.will * 0.5 + S.mind * 0.3 + S.renown * 0.2;
  const injuryFactor = 1 - S.injury / 200;
  return Math.floor(base * injuryFactor);
}
function resolveBattle(enemy) {
  const pRoll = battlePower() + rand(1, 30);
  const eRoll = enemy.power + rand(1, 30);
  const win = pRoll >= eRoll;
  return { win, text: win
    ? `你战胜了【${enemy.name}】（你 ${pRoll} vs 敌 ${eRoll}）`
    : `你被【${enemy.name}】击败（你 ${pRoll} vs 敌 ${eRoll}）` };
}

/* 洗牌队列缓存 */
let shuffleQueues = {};

/* 洗牌抽取：把池子洗成一叠牌，按顺序抽，抽完重新洗 */
function shuffleDraw(pool, queueKey) {
  if (!shuffleQueues[queueKey] || shuffleQueues[queueKey].length === 0) {
    shuffleQueues[queueKey] = pool.slice().sort(() => Math.random() - 0.5);
  }
  return shuffleQueues[queueKey].shift();
}

============================ */
function checkPromotion() {
  if (S.phase !== 'path' || S.rank >= 4) return;
 while (S.progress >= 100 && S.rank < 4) {
    S.progress -= 100;
    S.rank++;
    addLog(`★★★ 晋升！你现在是【${PATHS[S.path].name} · ${PATHS[S.path].ranks[S.rank]}】`, 'promo');
    applyInjury(-15);
    S.restCharges = Math.min(S.restCharges + 1, 2);
    if (S.rank >= 4) {
      S.progress = 0;
      triggerGodTrial();
      return;
    }
  }
}

/* ============================
   累积伤势系统
============================ */
function applyInjury(delta) {
  const before = S.injury;
  S.injury = clamp(S.injury + delta, 0, 100);

  // 阈值提示
  if (delta > 0 && S.injury > before) {
    if (S.injury >= 90 && !S.injuryNotified90) {
      addLog('你感觉到生命正在从伤口流走。', 'death');
      S.injuryNotified90 = true;
    } else if (S.injury >= 60 && !S.injuryNotified60) {
      addLog('你的身体每况愈下。伤口在夜里渗血。', 'dark');
      S.injuryNotified60 = true;
    } else if (S.injury >= 30 && !S.injuryNotified30) {
      addLog('你的旧伤开始隐隐作痛。', 'dark');
      S.injuryNotified30 = true;
    }
  }

  // 立即死亡判定
  if (S.injury >= 100 && !S.cheatMode) {
    S.ended = true;
    S.phase = 'ended';
    S.currentEvent = null;
    addLog('你的身体终于支撑不住了。', 'death');
    addLog('伤势累积过多，你倒下了。', 'death');
    saveGame(); render();
    return true;
  }
  return false;
}

function checkInjuryDeath() {
  if (S.cheatMode) return false;
  if (S.injury >= 90 && Math.random() < 0.15) {
    addLog('濒死的身体再也扛不住了。', 'death');
    S.ended = true;
    S.phase = 'ended';
    S.currentEvent = null;
    saveGame(); render();
    return true;
  }
  return false;
}

/* ============================
   死亡检查
============================ */
function checkDeath(choice) {
  if (choice.death === undefined) return false;

  // ★ 作弊者免疫死亡
  if (S.cheatMode) {
    if (Math.random() < choice.death) {
      addLog('【作弊者权限：死亡已被抵消】', 'cheat');
    }
    return false;
  }

  if (Math.random() < choice.death) {
    const isCorrupt = S.corruption > 50;
    addLog(choice.deathText || '你死了。', 'death');
    addLog(isCorrupt
      ? '你的灵魂被亚空间吞噬。你成为了无数低语中的一个，永远在黑暗中漂泊。'
      : '你的灵魂回归帝皇的怀抱。你的一生虽短，但你从未背叛。',
      isCorrupt ? 'death' : 'sys');
    S.ended = true; S.phase = 'ended'; S.currentEvent = null;
    saveGame(); render();
    return true;
  }
  return false;
}

    html += `<span class="rest-count">🛌 ×${S.restCharges}</span>`;

  if (S.phase === 'path' && !S.ended) {

function renderChoices() {
  const el = document.getElementById('choices');
  el.innerHTML = '';

    btn.style.cssText = 'text-align:center;letter-spacing:3px;padding:16px;font-size:16px;background:#2a1a10;border-color:#7a4a1a;color:#e0a040;font-weight:bold;';
    btn.onclick = () => {

        document.getElementById('log').innerHTML = '';
        document.getElementById('choices').innerHTML = '';

        setMenuNote('✓ 游戏已重置。', 'ok');
      } catch (e) {
        try { localStorage.removeItem('hiveFate_v4_save'); } catch(_) {}
        location.reload();
      }
    };

  if (S.currentEvent) {
    S.currentEvent.choices.forEach((c, i) => {
      const btn = document.createElement('button');
      let text = c.text;
      if (S.cheatMode) {
        const eff = formatEffect(c.effect);
        if (eff) text += `<span class="hint">[${eff}]</span>`;
          if (c.death !== undefined) text += `<span class="risk">[死亡 ${Math.round(c.death*100)}%]</span>`;

          const iv = c.effect.injury;
          text += `<span class="hint">[伤势 ${iv > 0 ? '+' : ''}${iv}]</span>`;
        }
        if (c.battle) text += `<span class="risk">[战斗：${c.battle.name} 战力${c.battle.power}]</span>`;

        if (c.reject) text += `<span class="hint">[拒绝神选]</span>`;
      }
      btn.innerHTML = text;
      btn.onclick = () => choose(i);
      el.appendChild(btn);
    });
  }

  // 休息按钮
  const isRestEvent = S.currentEvent && S.currentEvent.id && S.currentEvent.id.startsWith('rest-');
  if (S.phase === 'path' && !S.ended && !isRestEvent && S.restCharges > 0 && S.injury >= 30) {
    const restBtn = document.createElement('button');
    restBtn.className = 'rest-btn';
    restBtn.innerHTML = `🛌 休息（剩余 ${S.restCharges} 次）`;

    el.appendChild(restBtn);
  }

/* ============================
   休息触发
============================ */
function triggerRest() {
  if (S.restCharges <= 0) return;
  if (S.injury < 30) return;
  if (S.ended) return;

  const restEvent = REST_EVENTS[S.path];
  if (!restEvent) return;

  S.currentEvent = restEvent;
  addLog('════════════════════════', 'sys');
  addLog(`【${restEvent.title}】${restEvent.text}`, 'event');
  saveGame();
  render();
}
/* ============================
   选择处理
============================ */
function choose(idx) {
  const ev = S.currentEvent;

  // ★ 空值防御：防止双击 / 快速点击导致的重复触发
  if (!ev || !ev.choices || !ev.choices[idx]) return;
  if (S.ended) return;

  const c = ev.choices[idx];

  // ★ 恢复事件专用处理
  if (ev.id && ev.id.startsWith('rest-')) {
    addLog(`【${ev.title}】你选择了：${c.text}`, 'event');
    if (c.failChance !== undefined && Math.random() < c.failChance) {
      addLog(c.failResult, 'dark');
      applyEffect(c.failEffect);
    } else {
      addLog(c.result, 'good');
      applyEffect(c.effect);
    }
    if (c.bonusHighestAttr) {
      const attrs = ['body', 'will', 'mind', 'renown'];
      const highest = attrs.reduce((a, b) => S[a] >= S[b] ? a : b);
      S[highest] = clamp(S[highest] + c.bonusHighestAttr);
      addLog(`你感到【${EFFECT_LABELS[highest]}】在增长。`, 'promo');
    }
    S.restCharges = Math.max(0, S.restCharges - 1);
    S.currentEvent = null;
    advanceAge();
    saveGame(); render(); nextEvent();
    return;
  }

  // 皈依某位混沌神
  if (c.acceptGod) {
    S.path = c.acceptGod;
    addLog(`【${ev.title}】你选择了：${c.text}`, 'event');
    addLog(c.result, 'dark');
    addLog(`你成为了【${PATHS[c.acceptGod].name}】。你的灵魂归属于【${PATHS[c.acceptGod].god}】。`, 'promo');
    recentEvents = [];
    S.currentEvent = null;
    advanceAge();
    saveGame(); render(); nextEvent();
    return;
  }

   // 拒绝当前神祇的注视
  if (c.rejectGodVision) {
    S.godsSeen.push(c.rejectGodVision);
    S.chaosJoinEventCount = 0;   // ★ 重置计数，下一位神祇需要再等 4 个事件
    addLog(`【${ev.title}】你选择了：${c.text}`, 'event');
    addLog(c.result, 'sys');
    if (S.godsSeen.length >= 4) {
      addLog('四位神祇都已注视过你。你依然是无分混沌的一员——你的灵魂不属于任何一位神。', 'promo');
    } else {
      addLog(`还有 ${4 - S.godsSeen.length} 位神祇在等待。下一位将在一年后到来。`, 'sys');
    }
    S.currentEvent = null;
    advanceAge();
    saveGame(); render(); nextEvent();
    return;
  }

  if (checkDeath(c)) return;

  if (c.ascend) {
    const isChaos = CHAOS_PATHS.includes(S.path);
    const rate = isChaos
      ? (S.corruption >= 80 ? 0.9 : S.corruption >= 60 ? 0.6 : 0.3)
      : (S.loyalty >= 80 ? 0.9 : S.loyalty >= 60 ? 0.6 : 0.3);
    addLog(`【${ev.title}】你选择了：${c.text}`, 'event');
    if (Math.random() < rate) {
      addLog('仪式成功。你的形态开始扭曲。血肉、骨骼、灵魂——一切都在重塑。', 'promo');
      endGame('ascend');
    } else {
      addLog('仪式失败。你的灵魂在亚空间的风暴中撕裂。', 'death');
      addLog('你没有成为神选。你成为了虚无。', 'death');
      endGame('ascendFail');
    }
    return;
  }

  if (c.reject) {
    addLog(`【${ev.title}】你选择了：${c.text}`, 'event');
    addLog('你拒绝了神选。你以凡人之躯，站在了顶点。', 'sys');
    endGame('reject');
    return;
  }

  if (c.join) {
    S.path = c.join;
    S.phase = 'path';
    S.rank = 0;
    S.progress = 0;
    recentEvents = [];
    addLog(`【${ev.title}】${c.text}`, 'event');
    addLog(c.result, 'good');
    addLog(`你踏上了【${PATHS[S.path].name}】的道路。当前阶位：${PATHS[S.path].ranks[0]}`, 'promo');
    S.currentEvent = null;

    // 加入混沌后，重置计数器和已见神祇
    if (c.join === 'chaos') {
      S.chaosJoinEventCount = 0;
      S.godsSeen = [];
      addLog('你走进了一片灰色的领域。四位神祇的目光若隐若现，但还没有一位向你伸出手。', 'dark');
    }

    advanceAge();
    saveGame(); render(); nextEvent();
    return;
  }

  if (S.phase === 'path' && checkIdeologicalClash()) {
    if (S.phase !== 'trial') S.currentEvent = null;
    advanceAge();
    saveGame(); render(); nextEvent();
    return;
  }

if (c.battle) {
    const result = resolveBattle(c.battle);
    addLog(`⚔ ${result.text}`, 'battle');
    if (!result.win) {
      applyEffect({ body:-5, will:-2 });
      addLog('你在战斗中受了伤。', 'dark');
      if (applyInjury(20)) return;
      if (S.phase === 'trial') { saveGame(); render(); return; }
      S.currentEvent = null;
      advanceAge();
      saveGame(); render(); nextEvent();
      return;
    } else {
      applyInjury(-3);
    }
  }

  addLog(`【${ev.title}】你选择了：${c.text}`, 'event');
  addLog(c.result, c.effect && c.effect.corruption > 0 ? 'dark' : '');
  applyEffect(c.effect);

  if (S.phase === 'trial') { saveGame(); render(); return; }

  if (c.onSuccess) {
    Object.entries(c.onSuccess).forEach(([k,v]) => { S[k] = v; });
    if (c.onSuccess.stcFound) addLog('你获得了 STC 的核心数据。这是人类失落的知识。', 'promo');
  }

  S.currentEvent = null;
  advanceAge();
  saveGame(); render();
  nextEvent();
}

function advanceAge() {
  S.eventCount++;
  if (S.eventCount % EVENTS_PER_YEAR === 0) {
    S.age++;
    addLog(`—— 时光流逝，你 ${S.age} 岁了 ——`, 'age');
  }
}

function nextEvent() {
  if (S.ended || S.phase === 'trial') return;
  if (checkInjuryDeath()) return;
  if (S.phase === 'hive' && S.age > 25) { endGame('hive'); return; }
  if (S.age > 45) { endGame('age'); return; }

  if (S.phase === 'hive') {
    // 招募事件优先
    const recruitPool = RECRUIT_EVENTS.filter(e =>
      !S.rejected.includes(e.id) && e.condition(S));
    if (recruitPool.length > 0 && Math.random() < 0.7) {
      S.currentEvent = pick(recruitPool);
      S.rejected.push(S.currentEvent.id);
    } else {
      // ★ 巢都事件分层：18 岁为分界线
      const tier = S.age >= 18 ? 'late' : 'early';
      const hiveTier = HIVE_EVENTS.filter(e => TIER_MAP[e.id] === tier);
      S.currentEvent = shuffleDraw(hiveTier, `hive_${tier}`);
    }
  } else if (S.phase === 'path') {
    // 混沌路线：检查是否该触发神祇的注视
    if (S.path === 'chaos') {
      S.chaosJoinEventCount++;
      if (S.chaosJoinEventCount > 4 && S.godsSeen.length < 4) {
        if (triggerNextGodVision()) {
          saveGame(); render();
          return;
        }
      }
    }

    // ★ 路径事件分层：rank 0-1 抽 early，rank 2-3 抽 mid
    const tier = (S.rank <= 1) ? 'early' : 'mid';

    // 路线专属事件 + 通用事件合并
    const pathPool    = PATH_EVENTS[S.path].filter(e => TIER_MAP[e.id] === tier);
    const genericPool = GENERIC_PATH_EVENTS.filter(e => TIER_MAP[e.id] === tier);
    const combined    = [...pathPool, ...genericPool];

    S.currentEvent = shuffleDraw(combined, `${S.path}_${tier}`);
  }

  addLog(`【${S.currentEvent.title}】${S.currentEvent.text}`, 'event');
  saveGame(); render();
}

/* ============================
   结局
============================ */
function endGame(type) {
  S.ended = true; S.phase = 'ended'; S.currentEvent = null;
  const total = S.body + S.will + S.mind + S.renown;
if (type === 'ascend') {
    addLog('════════════════════════', 'promo');

    if (S.path === 'sm') {
      addLog('你脱下了最后的凡人之躯。', 'promo');
      addLog('帝皇的光芒在你体内燃烧，比任何时候都要明亮。', 'promo');
      addLog('你已成为星际战士中的传奇，每个同袍都在以你的名字祷告。', 'promo');
      addLog('你的名字不再属于战团，而属于整个帝国。', 'promo');
      addLog('在黑暗的第四十个千年，你也是人们心中的希望。', 'promo');
    } else if (S.path === 'tech') {
      addLog('你的血肉成为了数据。', 'promo');
      addLog('万机神的齿轮在你体内转动，你终于理解了所有代码。', 'promo');
      addLog('你融入了机魂——不是万机神的仆人，而是他的一部分。', 'promo');
      addLog('你的意识在每一个伺服机中回响，在每一台泰坦中安眠。', 'promo');
      addLog('肉体是脆弱的。', 'promo');
      addLog('而你，是永恒。', 'promo');
    } else if (S.path === 'ig') {
      addLog('你是帝皇的士兵，偶尔也是他行走于凡间的代言人。', 'promo');
      addLog('你成为了星界军的传奇：一个在每个新兵训练营被讲述的名字，一个活着的奇迹，一个帝皇赐福的战士。', 'promo');
      addLog('他们说你的激光枪永远不会打空，他们说你永远不会倒下。', 'promo');
      addLog('他们说你还在某处战斗。', 'promo');
      addLog('他们说得对。', 'promo');
    } else if (S.path === 'chaos') {
      addLog('你站在了顶点，但没有任何一位神祇能够独占你。', 'promo');
      addLog('四位神祇同时注视于你，向你庆祝他们的赐福。', 'promo');
      addLog('你成为了诸神争夺的宠儿——一个不属于任何单一神祇的恶魔王子，你的名字在所有神祇的领域中回响。', 'promo');
      addLog('既是争论的焦点，也是永恒的传奇。', 'promo');
    } else if (S.path === 'rebel') {
      addLog('你消失在帝国的记录中，但每一个角落都有人在低声念诵你的名字。', 'promo');
      addLog('你的舰队让海军上将们彻夜难眠，你的旗帜飘扬在那些被认为坚不可摧的世界之上。', 'promo');
      addLog('你成为了令帝国星区闻风丧胆的海盗——一个活着的传说，一个帝国永远无法捕获的幽灵。', 'promo');
      addLog('他们称你为叛徒、异端、罪人。', 'promo');
      addLog('但追随你的人称你为——自由。', 'promo');
    } else if (S.path === 'khorne') {
      addLog('你从凡人的躯壳中脱出。', 'promo');
      addLog('黄铜王座上的身影站了起来，第一次为你起立。', 'promo');
      addLog('你成为了血碾大魔——不是侍奉血神的猎犬，而是与他并肩的存在。', 'promo');
      addLog('八重之路为你敞开，你的名字成为战吼。', 'promo');
      addLog('血，为血神而流。', 'promo');
      addLog('颅骨，为颅骨王座而堆。', 'promo');
    } else if (S.path === 'nurgle') {
      addLog('你不再需要凡人的身体。', 'promo');
      addLog('祖父的花园为你打开了最后一扇门。', 'promo');
      addLog('你成为了大不净者——不是花园里的园丁，而是花园本身。', 'promo');
      addLog('你的呼吸成为新的瘟疫，你的微笑成为病患的安慰。', 'promo');
      addLog('腐朽，是你的祝福。', 'promo');
      addLog('生命，在你的腐烂中诞生。', 'promo');
    } else if (S.path === 'slaanesh') {
      addLog('你的形态失去了最后的束缚。', 'promo');
      addLog('黑暗王子第一次亲自为你斟酒。', 'promo');
      addLog('你成为了守秘者——不是宫殿里的仆从，而是宫殿的一部分。', 'promo');
      addLog('你的存在本身成为诱惑，你的呼吸成为欢愉。', 'promo');
      addLog('完美，不再是追求。', 'promo');
      addLog('完美，是你。', 'promo');
    } else if (S.path === 'tzeentch') {
      addLog('你终于理解了所有可能。', 'promo');
      addLog('万变之主为你展示了最后一个秘密。', 'promo');
      addLog('你成为了万变魔君——不是命运的执行者，而是命运本身。', 'promo');
      addLog('你的每一个念头都是一个计划，你的每一次呼吸都是一次改变。', 'promo');
      addLog('未来，不再有唯一。', 'promo');
      addLog('未来，皆是你。', 'promo');
    } else {
      addLog('你升魔成功。你成为了不朽的恶魔王子。', 'promo');
      addLog('从此，你的名字被凡人低声念诵——既是诅咒，也是恐惧。', 'promo');
    }
  } else if (type === 'ascendFail') {
    addLog('════════════════════════', 'death');
    addLog(`你的灵魂在亚空间的风暴中撕裂。你的名字被抹去。`, 'death');
    addLog(`你没有成为神选。你成为了虚无中的一缕低语。`, 'death');
  } else if (type === 'reject') {
    addLog('════════════════════════', 'sys');
    addLog(`你拒绝了神选，以凡人之躯站在了【${PATHS[S.path].name} · ${PATHS[S.path].ranks[4]}】的顶点。`, 'sys');
    addLog(`在战锤的黑暗银河中，你活成了一个传奇。`, 'sys');
    if (S.path === 'sm' && S.corruption >= 60) addLog('你最终被腐化吞噬。你成为了混沌星际战士，一名黑暗使徒。', 'dark');
    if (S.path === 'ig' && S.corruption >= 60) addLog('你背叛了帝皇。你的部队变成了混沌战帮，你的名字被列为亵渎。', 'dark');
    if (S.path === 'tech' && S.stcFound) addLog('你保存了 STC 的核心数据。在你死后，这份知识将改变整个星区的命运。', 'promo');
  } else if (type === 'hive') {
    addLog('════════════════════════', 'sys');
    addLog(`${S.name}，你在巢都中度过了一生。没有人记得你的名字。`, 'sys');
    addLog(`你的尸体被回收成蛋白质块，喂给下一批少年。`, 'sys');
    addLog(`这就是巢都千万凡人的命运。`, 'sys');
  } else if (type === 'age') {
    addLog('════════════════════════', 'sys');
    addLog(`${S.name}，你的身体不再年轻。作为一名【${PATHS[S.path].ranks[S.rank]}】，你选择了退场。`, 'sys');
    if (S.path === 'sm' && S.corruption >= 60) addLog('但你最终被腐化吞噬。你成为了混沌星际战士。', 'dark');
    if (S.path === 'ig' && S.corruption >= 60) addLog('你的部队变成了混沌战帮。你的名字被列为亵渎。', 'dark');
    if (S.path === 'tech' && S.stcFound) addLog('你保存的 STC 数据将在你死后改变整个星区。', 'promo');
    addLog(`最终属性：肉体${S.body} 意志${S.will} 智慧${S.mind} 声望${S.renown} 腐化${S.corruption} 忠诚${S.loyalty}`, 'sys');
    addLog(`总分 ${total}。`, 'sys');
  }
  saveGame(); render();
  }
/* ============================
   主菜单
============================ */
function backToMenu() {
  document.getElementById('log').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
  shuffleQueues = {};          // ★ 清空洗牌队列
  showScreen('menuScreen');
  updateMenuButtons();
}

function updateMenuButtons() {
  const loadBtn = document.getElementById('menuLoad');
  const saveBtn = document.getElementById('menuSave');
  const saved = loadGame();
  loadBtn.disabled = !saved;
  saveBtn.disabled = !S.started || S.ended;
}

function setMenuNote(text, cls = '') {
  const el = document.getElementById('menuNote');
  el.textContent = text;
  el.className = 'menu-note ' + cls;
}

document.getElementById('menuStart').onclick = () => {
  document.getElementById('nameField').value = '';
  setMenuNote('');
  showScreen('nameScreen');
  setTimeout(() => document.getElementById('nameField').focus(), 50);
};

document.getElementById('menuSave').onclick = () => {
  if (!S.started || S.ended) {
    setMenuNote('没有进行中的游戏。', 'warn');
    return;
  }
  saveGame();
  setMenuNote('✓ 游戏已保存到本地浏览器。', 'ok');
};

document.getElementById('menuLoad').onclick = () => {
  const saved = loadGame();
  if (!saved) { setMenuNote('没有找到存档。', 'warn'); return; }
  S = saved;
  S.currentEvent = null;
  S.ended = false;
  recentEvents = [];
  shuffleQueues = {};          // ★ 清空洗牌队列
  document.getElementById('log').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
  showScreen('gameScreen');
  addLog('—— 存档已载入 ——', 'sys');
  if (S.phase === 'trial') {
    S.phase = 'path';
    triggerGodTrial();
  } else if (!S.currentEvent) {
    nextEvent();
    return;
  }
  render();
};

document.getElementById('menuQuit').onclick = () => {
  showScreen('quitScreen');
};

/* ============================
   命名界面
============================ */
document.getElementById('nameConfirm').onclick = () => {
  const name = document.getElementById('nameField').value.trim() || '无名者';
  S = DEFAULT_STATE();
  S.name = name;
  S.cheatMode = (name === '作弊者');
  S.started = true;
  recentEvents = [];
  shuffleQueues = {};          // ★ 清空洗牌队列
  document.getElementById('log').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
  showScreen('gameScreen');

  addLog(`欢迎，${S.name}。`, 'sys');
  addLog('你出生在下巢。雾气、机油、尸臭和祷文，是你对世界最初的记忆。', 'sys');
  if (S.cheatMode) addLog('【警告：检测到调试者权限。属性面板已开放。】', 'cheat');
  addLog('你的选择将决定你的命运。每做出 4 次选择，你就会长大一岁。', 'sys');

  saveGame();
  render();
  nextEvent();
};

document.getElementById('nameBack').onclick = () => {
  setMenuNote('');
  backToMenu();
};
document.getElementById('nameField').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('nameConfirm').click();
});

document.getElementById('backToMenu').onclick = () => {
  saveGame();
  backToMenu();
  setMenuNote('游戏已自动保存。', 'ok');
};

document.getElementById('quitBack').onclick = () => {
  setMenuNote('');
  backToMenu();
};

(function init() {
  showScreen('menuScreen');
  updateMenuButtons();
})();
</script>
